<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiDock - Login</title>
</head>
<body>

    <div class="cabecalho">
        <img src="logo.png" alt="Logo" id="id_logo">
    </div>

    <h1 id="titulo">LOGIN</h1>

    <div class="container">


        <div class="container_input" id="input_email">
            <img src="icone_email.png" alt="">
            <input type="text" id="ipt_email" placeholder="EMAIL">
        </div>

        <div class="container_input" id="input_senha">
            <img src="icone_senha.png" alt="">
            <input type="text" id="ipt_senha" placeholder="SENHA">
            <img id="icone_olho_senha" src="icone_olho_senha.png" alt="">
        </div>

        <button onclick="entrar()">ENTRAR</button>
    
        <div class="rodape">
            <div id="esqueci_senha">Esqueci a senha</div>
            <div id="ir_cadastro">NÃO POSSUI CONTA? CADASTRE-SE</div>
            <div class="erro">
                <img src="" alt="" id="icone_erro">
                <div id="msg_erro"></div>
            </div>
        </div>
    </div>
    
</body>

<script>

</script>

<style>

:root{
    --branco: #ffffff;
    --branco_opaco: rgba(255, 255, 255, 0.8);
    --azul_claro: #3b82f6;
    --vermelho: #d30202;
}

body{
    display: flex;
    flex-direction: column;
    align-items: center;
    background-image: url(background.png);
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    min-height: 100vh;
}

.cabecalho{
   width: 100%;
}

#id_logo{
    height: auto;
    width: 300px;
}

#titulo{
    color: var(--branco_opaco);
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 500;
    letter-spacing: 0.1rem;
}


.container{
    display: flex;
    flex-direction: column;
    gap: 30px;
    width: 90%;
    max-width: 500px;
}

.container_input{
    display: flex;
    align-items: center;
    gap: 20px;
    border: 1.5px solid var(--branco);
    border-radius: 5px;
    padding: 15px 15px;
}

.container_input input{
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: var(--branco);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 20px;
}

.container_input input::placeholder{
    color: var(--branco);
}

#icone_olho_senha{
    cursor: pointer;
}


button{
    width: 100%;
    padding: 14px;
    background: var(--branco);
    color: var(--azul_claro);
    border: none;
    border-radius: 10px;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 500;
    font-size: 15px;
    cursor: pointer;
}

.rodape{
    display: flex;
    flex-direction: column;
    align-items: center;
}

#esqueci_senha{
    color: var(--branco_opaco);
    font-family: Arial, Helvetica, sans-serif;
    margin-bottom: 10px;
}

#ir_cadastro{
    color: var(--branco);
    margin-bottom: 10px;
    font-family: Arial, Helvetica, sans-serif;
    letter-spacing: 0.03em;
}

.erro{
    display: flex;
    gap: 6px;
    text-transform: uppercase;
    color: var(--vermelho);
    font-family: Arial, Helvetica, sans-serif;
    letter-spacing: 0.05em;
}

#icone_erro{
    width: 16px;
    height: auto;
}
</style>

</html>
